# Kong upstreams — FastAPI backend (two pools: regular + SSE-dedicated).
# HTTP/2 on Kong's HTTPS listener handles browser→Kong multiplexing (no 6-conn limit).
# Two separate upstreams handle Kong→FastAPI isolation:
#   fastapi-upstream       — regular short-lived requests (keepalive pool reuse)
#   fastapi-sse-upstream   — long-lived SSE connections (keepalive disabled;
#                            connections are closed after each stream ends)
# BACKEND_HOST / BACKEND_PORT are injected via docker-compose environment variables.
upstreams:
  - name: fastapi-upstream
    algorithm: round-robin
    healthchecks:
      active:
        healthy:
          interval: 60
          successes: 1
        unhealthy:
          interval: 10
          http_failures: 3
        http_path: /health
        timeout: 5
    targets:
      - target: "{BACKEND_HOST}:{BACKEND_PORT}"
        weight: 100
      - target: "{BACKEND_HOST}:{BACKEND_PORT_2}"
        weight: 100

  # Dedicated upstream for long-lived SSE connections.
  # KONG_NGINX_UPSTREAM_KEEPALIVE=32 is set in docker-compose.yml for the
  # regular pool; SSE connections are closed by the upstream when the stream
  # ends (FastAPI closes the response), so they don't linger in the pool.
  - name: fastapi-sse-upstream
    algorithm: round-robin
    healthchecks:
      active:
        healthy:
          interval: 60
          successes: 1
        unhealthy:
          interval: 10
          http_failures: 3
        http_path: /health
        timeout: 5
    targets:
      - target: "{BACKEND_HOST}:{BACKEND_PORT}"
        weight: 100
      - target: "{BACKEND_HOST}:{BACKEND_PORT_2}"
        weight: 100
