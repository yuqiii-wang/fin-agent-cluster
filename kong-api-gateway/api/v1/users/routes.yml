# Query routes — submit, cancel, and poll financial analysis queries.
# Source: api/v1/users/routes.yml
#
# Request classification:
#   fastapi-runner    — LangGraph-triggering routes (submit, ack)
#   fastapi-assistant — Non-LangGraph routes (reads, cancel, perf-stable)
#
#   POST /api/v1/users/query                               submit a new query      → runner
#   POST /api/v1/users/query/{thread_id}/ack               start LangGraph run     → runner
#   POST /api/v1/users/query/{thread_id}/cancel            cancel a running query  → assistant
#   POST /api/v1/users/query/{thread_id}/perf-stable       signal stable TPS       → assistant
#   GET  /api/v1/users/query/{thread_id}                   poll query status       → assistant
#   GET  /api/v1/users/query/{thread_id}/tasks             list agent sub-tasks    → assistant
#   GET  /api/v1/users/query/{thread_id}/nodes             node-level I/O          → assistant
routes:
  # ── Runner routes (LangGraph-triggering) ────────────────────────────────────

  # Dedicated route for query submission — routes to runners only.
  # Relaxed rate limit so high-concurrency perf-test sessions can burst-submit.
  - name: route-query-submit
    service: fastapi-runner
    paths:
      - ~/api/v1/users/query$
    methods: [POST, OPTIONS]
    strip_path: false
    protocols: [http, https]
    plugins:
      - name: rate-limiting
        config:
          minute: 6000
          hour: 100000
          policy: local
          limit_by: ip
          hide_client_headers: false

  # ACK route — starts LangGraph execution; must go to a runner instance.
  - name: route-query-ack
    service: fastapi-runner
    paths:
      - ~/api/v1/users/query/[^/]+/ack$
    methods: [POST, OPTIONS]
    strip_path: false
    protocols: [http, https]

  # ── Assistant routes (non-LangGraph) ────────────────────────────────────────

  # All remaining user/query endpoints: reads, cancel, perf-stable.
  # Raised rate limit: cancel is a lightweight fire-and-forget operation and
  # must not 429 during high-concurrency load tests (N streams all timing out).
  - name: route-queries
    service: fastapi-assistant
    paths:
      - /api/v1/users
    strip_path: false
    protocols: [http, https]
    plugins:
      - name: rate-limiting
        config:
          minute: 6000
          hour: 100000
          policy: local
          limit_by: ip
          hide_client_headers: false
