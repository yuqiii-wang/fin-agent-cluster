# Stream utility routes -- done-ack, status-ack.
# Real-time streaming is via Centrifugo WebSocket (see centrifugo/routes.yml).
#
#   POST /api/v1/stream/{thread_id}/done-ack    -- done acknowledgement
#   POST /api/v1/stream/{thread_id}/status-ack  -- query_status phase acknowledgement
#
# route-stream-double-check (higher priority): requests carrying X-Double-Check: true
# are re-delivery ACKs triggered by the assistant verifier; pin them explicitly to
# the assistant upstream so they are always handled by the same process that
# manages the query_status_ack Redis store.
routes:
  - name: route-stream-double-check
    service: fastapi-assistant
    paths:
      - /api/v1/stream
    headers:
      x-double-check:
        - "true"
    strip_path: false
    protocols: [http, https]
    plugins:
      # Raised rate limit: double-check re-delivery ACKs are lightweight and
      # must not 429 during high-concurrency load tests (N streams × M phases).
      - name: rate-limiting
        config:
          minute: 60000
          hour: 600000
          policy: local
          limit_by: ip
          hide_client_headers: false
  - name: route-stream-utils
    service: fastapi-assistant
    paths:
      - /api/v1/stream
    strip_path: false
    protocols: [http, https]
    plugins:
      # Raised rate limit: status-ack / done-ack are lightweight fire-and-forget
      # operations; must not 429 under high-concurrency load (N sessions × phases).
      - name: rate-limiting
        config:
          minute: 60000
          hour: 600000
          policy: local
          limit_by: ip
          hide_client_headers: false
