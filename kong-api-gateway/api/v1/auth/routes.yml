# Auth routes — guest session creation, user history, and Centrifugo JWT bootstrap.
# Source: api/v1/auth/routes.yml
#
#   POST /api/v1/auth/guest                        create or revalidate a guest session
#   GET  /api/v1/auth/me/history                   paginated thread history for the caller
#   GET  /api/v1/auth/me/active                    most recent in-progress thread
#   GET  /api/v1/auth/centrifugo/token?thread_id=  Centrifugo connection + subscription JWTs
routes:
  # More-specific route for the Centrifugo token endpoint so it gets a higher rate limit.
  # Kong matches the longest path prefix first, so this takes priority over route-auth below.
  - name: route-auth-centrifugo-token
    service: fastapi-assistant
    paths:
      - /api/v1/auth/centrifugo
    strip_path: false
    protocols: [http, https]
    plugins:
      # Token endpoint is pure JWT signing (no DB) — must survive bursts of 100+
      # simultaneous sessions during high-concurrency perf tests.
      - name: rate-limiting
        config:
          minute: 6000
          hour: 100000
          policy: local
          limit_by: ip
          hide_client_headers: false

  - name: route-auth
    service: fastapi-assistant
    paths:
      - /api/v1/auth
    strip_path: false
    protocols: [http, https]
