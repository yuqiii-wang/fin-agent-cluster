# System health route — aggregate health across all FastAPI instances.
#
#   GET /api/v1/system/health  → fastapi-runner upstream
#
# The runner instance probes all configured runner + assistant ports and
# returns a JSON summary so the frontend can wait until every instance is
# healthy before auto-triggering the E2E test.
routes:
  - name: route-system-health
    service: fastapi-runner
    paths:
      - /api/v1/system
      - /api/v1/system/health
    strip_path: false
    methods: [GET, OPTIONS]
    protocols: [http, https]
