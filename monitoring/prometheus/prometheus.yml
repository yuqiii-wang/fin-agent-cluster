global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Scrape nginx-internal metrics via the nginx-prometheus-exporter sidecar.
  # Exposes connection counts, request rates, and upstream health.
  - job_name: nginx-internal
    static_configs:
      - targets:
          - nginx-internal-exporter:9113
    metrics_path: /metrics
