global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Scrape nginx-internal metrics via the nginx-prometheus-exporter sidecar.
  # Exposes connection counts, request rates, and upstream health.
  - job_name: nginx-internal
    static_configs:
      - targets:
          - nginx-internal-exporter:9113
    metrics_path: /metrics

  # Scrape Prometheus metrics from each FastAPI runner instance.
  # Instances run on the WSL2 host (host.docker.internal resolves to host gateway).
  # Ports: FASTAPI_PORT (8432) + instance index (0–3).
  # Each instance exposes SSE notification ACK/NACK counters and latency histograms.
  - job_name: fastapi-runner
    metrics_path: /metrics
    static_configs:
      - targets:
          - host.docker.internal:8432
          - host.docker.internal:8433
          - host.docker.internal:8434
          - host.docker.internal:8435
        labels:
          service: fastapi-runner
