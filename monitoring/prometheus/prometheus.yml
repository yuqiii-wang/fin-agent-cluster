global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Scrape nginx-api metrics via the nginx-prometheus-exporter sidecar.
  # Exposes connection counts, request rates, and upstream health.
  - job_name: nginx-api
    static_configs:
      - targets:
          - nginx-api-exporter:9113
    metrics_path: /metrics
