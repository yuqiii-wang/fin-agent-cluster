services:
  postgres-primary:
    image: postgres:18.3-trixie
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-P@ssw0rd123}
      POSTGRES_DB: ${POSTGRES_DB:-fin_trading}
      POSTGRES_REPLICATION_USER: ${POSTGRES_REPLICATION_USER:-replicator}
      POSTGRES_REPLICATION_PASSWORD: ${POSTGRES_REPLICATION_PASSWORD:-replpassword}
    command: postgres -c max_connections=300
    ports:
      - "${POSTGRES_PORT:-6543}:5432"
    volumes:
      - postgres_primary_data:/var/lib/postgresql
      - ./sql/postgres/primary/init-replication.sh:/docker-entrypoint-initdb.d/init-replication.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-replica:
    image: postgres:18.3-trixie
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-P@ssw0rd123}
      POSTGRES_DB: ${POSTGRES_DB:-fin_trading}
      POSTGRES_REPLICATION_USER: ${POSTGRES_REPLICATION_USER:-replicator}
      POSTGRES_REPLICATION_PASSWORD: ${POSTGRES_REPLICATION_PASSWORD:-replpassword}
      PRIMARY_HOST: postgres-primary
      PGDATA: /var/lib/postgresql/18/docker
    user: root
    entrypoint: ["/bin/bash", "/replica-setup.sh"]
    ports:
      - "${POSTGRES_REPLICA_PORT:-6544}:5432"
    volumes:
      - postgres_replica_data:/var/lib/postgresql
      - ./sql/postgres/replica/setup.sh:/replica-setup.sh:ro
    depends_on:
      postgres-primary:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis-token-0:
    image: redis:8.6.2-trixie
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-3456}:6379"
    volumes:
      - redis_token_0_data:/data

  redis-token-1:
    image: redis:8.6.2-trixie
    restart: unless-stopped
    ports:
      - "${REDIS_PORT_1:-3457}:6379"
    volumes:
      - redis_token_1_data:/data

  redis-sse-0:
    image: redis:8.6.2-trixie
    restart: unless-stopped
    ports:
      - "${REDIS_SSE_PORT:-3459}:6379"
    volumes:
      - redis_sse_0_data:/data

  redis-sse-1:
    image: redis:8.6.2-trixie
    restart: unless-stopped
    ports:
      - "${REDIS_SSE_PORT_1:-3460}:6379"
    volumes:
      - redis_sse_1_data:/data

  kong-migrations:
    image: kong/kong-gateway:3.12.0.5-20260415-rhel-fips
    command: kong migrations bootstrap
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: postgres-primary
      KONG_PG_PORT: "5432"
      KONG_PG_USER: ${POSTGRES_USER:-admin}
      KONG_PG_PASSWORD: ${POSTGRES_PASSWORD:-P@ssw0rd123}
      KONG_PG_DATABASE: ${KONG_DB:-kong}
    depends_on:
      postgres-primary:
        condition: service_healthy
    restart: "no"

  kong-config-import:
    image: kong/kong-gateway:3.12.0.5-20260415-rhel-fips
    command: kong config db_import /etc/kong/kong.yml
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: postgres-primary
      KONG_PG_PORT: "5432"
      KONG_PG_USER: ${POSTGRES_USER:-admin}
      KONG_PG_PASSWORD: ${POSTGRES_PASSWORD:-P@ssw0rd123}
      KONG_PG_DATABASE: ${KONG_DB:-kong}
    volumes:
      - ./kong-api-gateway/kong.yml:/etc/kong/kong.yml:ro
    depends_on:
      kong-migrations:
        condition: service_completed_successfully
    restart: "no"

  kong:
    image: kong/kong-gateway:3.12.0.5-20260415-rhel-fips
    restart: unless-stopped
    extra_hosts:
      # Resolve host.docker.internal on Linux (automatic on Docker Desktop only).
      - "host.docker.internal:host-gateway"
    volumes:
      - ./logs:/logs                       # bind-mount so file-log plugin writes to host ./logs/kong.log
      # TLS cert for HTTPS/HTTP2 proxy listener (port 8443).
      # Bind-mount keeps host files live inside the container, but Kong reads
      # SSL cert/key only at nginx worker spawn.  setup/tls.sh --force-tls
      # regenerates the cert AND restarts Kong automatically via
      # `docker compose up -d --force-recreate kong`.
      - ./certs:/certs:ro
    depends_on:
      kong-config-import:
        condition: service_completed_successfully
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: postgres-primary
      KONG_PG_PORT: "5432"
      KONG_PG_USER: ${POSTGRES_USER:-admin}
      KONG_PG_PASSWORD: ${POSTGRES_PASSWORD:-P@ssw0rd123}
      KONG_PG_DATABASE: ${KONG_DB:-kong}
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: "0.0.0.0:8001"
      KONG_ADMIN_GUI_LISTEN: "0.0.0.0:8002"
      # Port 8000 (→ host 8888): HTTP/1.1 — internal backend calls (KONG_API_URL).
      # Port 8443 (→ host 8443): HTTPS + HTTP/2 — browser traffic (REST, WS, SSE).
      KONG_PROXY_LISTEN: "0.0.0.0:8000, 0.0.0.0:8443 ssl http2"
      KONG_SSL_CERT: /certs/localhost.crt
      KONG_SSL_CERT_KEY: /certs/localhost.key
      # Tell Kong Manager which external URLs to use from the browser
      KONG_ADMIN_GUI_URL: "http://localhost:${KONG_MANAGER_PORT:-8886}"
      KONG_ADMIN_GUI_API_URL: "http://localhost:${KONG_ADMIN_PORT:-8887}"
      KONG_PG_POOL_SIZE: "5"
      KONG_PG_BACKLOG: "10"
      KONG_NGINX_WORKER_PROCESSES: "8"   # one worker per CPU core
      KONG_MEM_CACHE_SIZE: "256m"
      KONG_DB_UPDATE_FREQUENCY: "10"
      KONG_LOG_LEVEL: debug
      KONG_NGINX_PROXY_ERROR_LOG: /dev/stderr debug
      # DNS resolver tuning — prevents 8-second cold-start delays and 1.2-second
      # TTL-expiry spikes seen in Kong access logs under high concurrency.
      # 127.0.0.11 is Docker's built-in DNS that resolves host.docker.internal
      # from /etc/hosts instantly.  Stale-TTL lets Kong keep serving the cached
      # IP while re-resolving in the background (no thundering-herd blocking).
      KONG_DNS_RESOLVER: "127.0.0.11"
      KONG_DNS_STALE_TTL: "3600"       # serve stale entry for up to 1 h during re-resolve
      KONG_DNS_NOT_FOUND_TTL: "0"      # don't cache NXDOMAIN responses
      KONG_DNS_ERROR_TTL: "0"          # don't cache resolver errors
      KONG_DNS_NO_SYNC: "off"          # serial re-resolve avoids concurrent DNS stampede
      # Upstream keepalive pool size per nginx worker.
      # With 8 workers, effective total = 8 × 256 = 2048 idle connections to FastAPI.
      # Sized for heavy perf-test workloads: 100+ concurrent streams each submitting
      # queries means many short-lived POST /users/query connections in rapid succession.
      # A large pool avoids TCP teardown/re-establish overhead on those bursts.
      KONG_NGINX_UPSTREAM_KEEPALIVE: "256"
    ports:
      - "${KONG_PROXY_PORT:-8888}:8000"
      - "${KONG_PROXY_TLS_PORT:-8443}:8443"
      - "${KONG_ADMIN_PORT:-8887}:8001"
      - "${KONG_MANAGER_PORT:-8886}:8002"
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 10s
      retries: 12

  # Static UI server — serves the production build of the React frontend.
  # Exposed directly on port 22332 (HTTPS); Kong is NOT in the path for UI assets.
  # Build with:  cd frontend && VITE_KONG_URL=https://localhost:8443 npm run build
  # Access via:  https://localhost:22332/
  ui:
    image: nginx:alpine
    restart: unless-stopped
    # Wait for Kong to be healthy before serving the UI so that browser
    # WebSocket upgrades through nginx → Kong succeed on the very first
    # page load (avoids 502 / transport errors during Kong startup).
    depends_on:
      kong:
        condition: service_healthy
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./nginx-ui.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    ports:
      - "${UI_PORT:-22332}:443"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "--no-check-certificate", "https://localhost/nginx-health"]
      interval: 10s
      timeout: 5s
      retries: 5

  centrifugo-token-0:
    image: centrifugo/centrifugo:v6.7.1-amd64
    restart: unless-stopped
    command: centrifugo -c /centrifugo/config.json
    volumes:
      - ./centrifugo/centrifugo-token-0/config.json:/centrifugo/config.json:ro
    environment:
      CENTRIFUGO_CLIENT_TOKEN_HMAC_SECRET_KEY: ${CENTRIFUGO_SECRET:-centrifugo-dev-secret-key}
      CENTRIFUGO_HTTP_API_KEY: ${CENTRIFUGO_API_KEY:-centrifugo-api-key}
    ports:
      - "${CENTRIFUGO_0_PORT:-8101}:8000"
    depends_on:
      - redis-token-0
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  centrifugo-token-1:
    image: centrifugo/centrifugo:v6.7.1-amd64
    restart: unless-stopped
    command: centrifugo -c /centrifugo/config.json
    volumes:
      - ./centrifugo/centrifugo-token-1/config.json:/centrifugo/config.json:ro
    environment:
      CENTRIFUGO_CLIENT_TOKEN_HMAC_SECRET_KEY: ${CENTRIFUGO_SECRET:-centrifugo-dev-secret-key}
      CENTRIFUGO_HTTP_API_KEY: ${CENTRIFUGO_API_KEY:-centrifugo-api-key}
    ports:
      - "${CENTRIFUGO_1_PORT:-8102}:8000"
    depends_on:
      - redis-token-1
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # centrifugo-sse-0/1 — dedicated Centrifugo nodes for lifecycle SSE events.
  # All FastAPI-published events (started, completed, done, query_*, node_*, stream_*) go here.
  # Thread sharding by SHA-256 % 2 ensures each thread always hits the same node.
  # centrifugo-token-0/1 are reserved exclusively for LLM token streaming.
  centrifugo-sse-0:
    image: centrifugo/centrifugo:v6.7.1-amd64
    restart: unless-stopped
    command: centrifugo -c /centrifugo/config.json
    volumes:
      - ./centrifugo/centrifugo-sse-0/config.json:/centrifugo/config.json:ro
    environment:
      CENTRIFUGO_CLIENT_TOKEN_HMAC_SECRET_KEY: ${CENTRIFUGO_SECRET:-centrifugo-dev-secret-key}
      CENTRIFUGO_HTTP_API_KEY: ${CENTRIFUGO_API_KEY:-centrifugo-api-key}
    ports:
      - "${CENTRIFUGO_SSE_PORT:-8103}:8000"
    depends_on:
      - redis-sse-0
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  centrifugo-sse-1:
    image: centrifugo/centrifugo:v6.7.1-amd64
    restart: unless-stopped
    command: centrifugo -c /centrifugo/config.json
    volumes:
      - ./centrifugo/centrifugo-sse-1/config.json:/centrifugo/config.json:ro
    environment:
      CENTRIFUGO_CLIENT_TOKEN_HMAC_SECRET_KEY: ${CENTRIFUGO_SECRET:-centrifugo-dev-secret-key}
      CENTRIFUGO_HTTP_API_KEY: ${CENTRIFUGO_API_KEY:-centrifugo-api-key}
    ports:
      - "${CENTRIFUGO_SSE_PORT_1:-8104}:8000"
    depends_on:
      - redis-sse-1
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:v3.11.2
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --web.enable-lifecycle       # allow hot-reload via POST /-/reload
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9988}:9090"
    depends_on:
      kong:
        condition: service_healthy

  loki:
    image: grafana/loki:main-9c3bd87
    restart: unless-stopped
    command: -config.file=/etc/loki/loki.yml
    volumes:
      - ./monitoring/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki_data:/loki


  promtail:
    image: grafana/promtail:3.6.10
    restart: unless-stopped
    command: -config.file=/etc/promtail/promtail.yml
    volumes:
      - ./monitoring/promtail/promtail.yml:/etc/promtail/promtail.yml:ro
      - ./logs:/logs:ro
    depends_on:
      - loki

  grafana:
    image: grafana/grafana-oss:13.0.1
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3210}:3000"
    depends_on:
      - prometheus
      - loki

volumes:
  postgres_primary_data:
  postgres_replica_data:
  redis_token_0_data:
  redis_token_1_data:
  redis_sse_0_data:
  redis_sse_1_data:
  prometheus_data:
  grafana_data:
  loki_data:
