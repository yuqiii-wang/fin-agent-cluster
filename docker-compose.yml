services:
  postgres-primary:
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-P@ssw0rd123}
      POSTGRES_DB: ${POSTGRES_DB:-fin_trading}
      POSTGRES_REPLICATION_USER: ${POSTGRES_REPLICATION_USER:-replicator}
      POSTGRES_REPLICATION_PASSWORD: ${POSTGRES_REPLICATION_PASSWORD:-replpassword}
    command: postgres -c max_connections=300
    ports:
      - "${POSTGRES_PORT:-6543}:5432"
    volumes:
      - postgres_primary_data:/var/lib/postgresql
      - ./sql/postgres/primary/init-replication.sh:/docker-entrypoint-initdb.d/init-replication.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-replica:
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-P@ssw0rd123}
      POSTGRES_DB: ${POSTGRES_DB:-fin_trading}
      POSTGRES_REPLICATION_USER: ${POSTGRES_REPLICATION_USER:-replicator}
      POSTGRES_REPLICATION_PASSWORD: ${POSTGRES_REPLICATION_PASSWORD:-replpassword}
      PRIMARY_HOST: postgres-primary
      PGDATA: /var/lib/postgresql/18/docker
    user: root
    entrypoint: ["/bin/bash", "/replica-setup.sh"]
    ports:
      - "${POSTGRES_REPLICA_PORT:-6544}:5432"
    volumes:
      - postgres_replica_data:/var/lib/postgresql
      - ./sql/postgres/replica/setup.sh:/replica-setup.sh:ro
    depends_on:
      postgres-primary:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
    # sandbox-net allows sandbox-runner containers to reach the replica for
    # read-only fin_markets queries via the sandbox-read role.
    networks:
      - default
      - sandbox-net

  redis-0:
    image: redis:8.6.2-trixie
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-3456}:6379"
    volumes:
      - redis_0_data:/data

  redis-1:
    image: redis:8.6.2-trixie
    restart: unless-stopped
    ports:
      - "${REDIS_PORT_1:-3457}:6379"
    volumes:
      - redis_1_data:/data

  # nginx-internal — API gateway (internal routing to FastAPI runners).
  # :8000  plain HTTP  — internal only (nginx-frontend /_backend_health, Prometheus exporter)
  # :8443  HTTPS/HTTP2 — browser REST traffic
  # Sticky routing by thread UUID via consistent-hashing; see nginx-internal.conf.
  nginx-internal:
    image: nginx:alpine
    restart: unless-stopped
    extra_hosts:
      # Resolve host.docker.internal on Linux (automatic on Docker Desktop only).
      - "host.docker.internal:host-gateway"
    networks:
      - default
      - sandbox-net
    volumes:
      - ./gateway/nginx-internal.conf:/etc/nginx/conf.d/nginx-internal.conf:ro
      - ./gateway/snippets:/etc/nginx/snippets:ro
      - ./certs:/etc/nginx/certs:ro
      - ./logs:/var/log/nginx
    ports:
      - "127.0.0.1:${NGINX_API_HTTP_PORT:-8888}:8000"
      - "${NGINX_API_TLS_PORT:-8443}:8443"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8000/nginx-health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # nginx-prometheus-exporter — scrapes nginx-internal /_nginx_status and exposes
  # Prometheus metrics on :9113.
  nginx-internal-exporter:
    image: nginx/nginx-prometheus-exporter:latest
    restart: unless-stopped
    command:
      - --nginx.scrape-uri=http://nginx-internal:8000/_nginx_status
    depends_on:
      nginx-internal:
        condition: service_healthy

  # nginx-frontend — static UI server for the React SPA.
  # Exposed directly on port 22332 (HTTPS); nginx-internal handles all API calls.
  # Build with:  cd frontend && VITE_API_URL=https://localhost:8443 npm run build
  # Access via:  https://localhost:22332/
  nginx-frontend:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      nginx-internal:
        condition: service_healthy
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./gateway/nginx-frontend.conf:/etc/nginx/conf.d/default.conf:ro
      - ./gateway/snippets:/etc/nginx/snippets:ro
      - ./certs:/etc/nginx/certs:ro
    ports:
      - "${UI_PORT:-22332}:443"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "--no-check-certificate", "https://localhost/nginx-health"]
      interval: 10s
      timeout: 5s
      retries: 5

  centrifugo-llm-0:
    image: centrifugo/centrifugo:v6.7.1-amd64
    restart: unless-stopped
    command: centrifugo -c /centrifugo/config.json
    volumes:
      - ./centrifugo/centrifugo-llm-0/config.json:/centrifugo/config.json:ro
    environment:
      CENTRIFUGO_CLIENT_TOKEN_HMAC_SECRET_KEY: ${CENTRIFUGO_SECRET:-centrifugo-dev-secret-key}
      CENTRIFUGO_HTTP_API_KEY: ${CENTRIFUGO_API_KEY:-centrifugo-api-key}
    ports:
      - "${CENTRIFUGO_0_PORT:-8101}:8000"
    depends_on:
      - redis-0
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  centrifugo-llm-1:
    image: centrifugo/centrifugo:v6.7.1-amd64
    restart: unless-stopped
    command: centrifugo -c /centrifugo/config.json
    volumes:
      - ./centrifugo/centrifugo-llm-1/config.json:/centrifugo/config.json:ro
    environment:
      CENTRIFUGO_CLIENT_TOKEN_HMAC_SECRET_KEY: ${CENTRIFUGO_SECRET:-centrifugo-dev-secret-key}
      CENTRIFUGO_HTTP_API_KEY: ${CENTRIFUGO_API_KEY:-centrifugo-api-key}
    ports:
      - "${CENTRIFUGO_1_PORT:-8102}:8000"
    depends_on:
      - redis-1
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # centrifugo-sse-0/1 — dedicated Centrifugo nodes for lifecycle SSE events.
  # All FastAPI-published events (started, completed, done, query_*, node_*, stream_*) go here.
  # Thread sharding by SHA-256 % 2 ensures each thread always hits the same node.
  # centrifugo-llm-0/1 are reserved exclusively for LLM token streaming.
  centrifugo-sse-0:
    image: centrifugo/centrifugo:v6.7.1-amd64
    restart: unless-stopped
    command: centrifugo -c /centrifugo/config.json
    volumes:
      - ./centrifugo/centrifugo-sse-0/config.json:/centrifugo/config.json:ro
    environment:
      CENTRIFUGO_CLIENT_TOKEN_HMAC_SECRET_KEY: ${CENTRIFUGO_SECRET:-centrifugo-dev-secret-key}
      CENTRIFUGO_HTTP_API_KEY: ${CENTRIFUGO_API_KEY:-centrifugo-api-key}
    ports:
      - "${CENTRIFUGO_SSE_PORT:-8103}:8000"
    depends_on:
      - redis-0
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  centrifugo-sse-1:
    image: centrifugo/centrifugo:v6.7.1-amd64
    restart: unless-stopped
    command: centrifugo -c /centrifugo/config.json
    volumes:
      - ./centrifugo/centrifugo-sse-1/config.json:/centrifugo/config.json:ro
    environment:
      CENTRIFUGO_CLIENT_TOKEN_HMAC_SECRET_KEY: ${CENTRIFUGO_SECRET:-centrifugo-dev-secret-key}
      CENTRIFUGO_HTTP_API_KEY: ${CENTRIFUGO_API_KEY:-centrifugo-api-key}
    ports:
      - "${CENTRIFUGO_SSE_PORT_1:-8104}:8000"
    depends_on:
      - redis-1
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:v3.11.2
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=90d
      - --web.enable-lifecycle       # allow hot-reload via POST /-/reload
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9988}:9090"
    depends_on:
      nginx-internal-exporter:
        condition: service_started

  loki:
    image: grafana/loki:main-9c3bd87
    restart: unless-stopped
    command: -config.file=/etc/loki/loki.yml
    volumes:
      - ./monitoring/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki_data:/loki


  promtail:
    image: grafana/promtail:3.6.10
    restart: unless-stopped
    command: -config.file=/etc/promtail/promtail.yml
    volumes:
      - ./monitoring/promtail/promtail.yml:/etc/promtail/promtail.yml:ro
      - ./logs:/logs:ro
    depends_on:
      - loki

  grafana:
    image: grafana/grafana-oss:13.0.1
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3210}:3000"
    depends_on:
      - prometheus
      - loki

  sandbox-runner-0:
    build:
      context: ./sandbox/runner
      dockerfile: Dockerfile
      network: host
    restart: unless-stopped
    networks:
      - sandbox-net
      # default network gives Playwright-driven Chromium outbound internet access.
      - default
    volumes:
      - sandbox_runner_0_data:/sandbox
    environment:
      SANDBOX_TIMEOUT_SECONDS: "120"
      SANDBOX_MAX_MEMORY_MB: "768"
      SANDBOX_MAX_CPU_SECONDS: "90"
      SANDBOX_MAX_PROCS: "128"
      SANDBOX_MAX_OPEN_FILES: "256"
      SANDBOX_MAX_OUTPUT_BYTES: "4194304"
      # Read-only DSN for sandboxed scripts — sandbox-read role, fin_markets schema only.
      SANDBOX_PG_DSN: "postgresql://sandbox-read:${SANDBOX_PG_READ_PASSWORD:-SandboxRd@2026}@postgres-replica:5432/fin_trading"
    deploy:
      resources:
        limits:
          memory: 1024M
          cpus: "1.0"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  sandbox-runner-1:
    build:
      context: ./sandbox/runner
      dockerfile: Dockerfile
      network: host
    restart: unless-stopped
    networks:
      - sandbox-net
      # default network gives Playwright-driven Chromium outbound internet access.
      - default
    volumes:
      - sandbox_runner_1_data:/sandbox
    environment:
      SANDBOX_TIMEOUT_SECONDS: "120"
      SANDBOX_MAX_MEMORY_MB: "768"
      SANDBOX_MAX_CPU_SECONDS: "90"
      SANDBOX_MAX_PROCS: "128"
      SANDBOX_MAX_OPEN_FILES: "256"
      SANDBOX_MAX_OUTPUT_BYTES: "4194304"
      # Read-only DSN for sandboxed scripts — sandbox-read role, fin_markets schema only.
      SANDBOX_PG_DSN: "postgresql://sandbox-read:${SANDBOX_PG_READ_PASSWORD:-SandboxRd@2026}@postgres-replica:5432/fin_trading"
    deploy:
      resources:
        limits:
          memory: 1024M
          cpus: "1.0"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  postgres_primary_data:
  postgres_replica_data:
  redis_0_data:
  redis_1_data:
  prometheus_data:
  grafana_data:
  loki_data:
  sandbox_runner_0_data:
  sandbox_runner_1_data:

networks:
  default:
  sandbox-net:
    internal: true
    driver: bridge
