# Common upstream proxy headers — included at server level in nginx-internal.
# NOTE: any location block that defines its own proxy_set_header directives
# will NOT inherit these (nginx inheritance rule); add them explicitly there.
proxy_http_version    1.1;
proxy_set_header      Connection      "";          # keep-alive to upstream
proxy_set_header      Host            $host;
proxy_set_header      X-Real-IP       $remote_addr;
proxy_set_header      X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header      X-Request-ID    $request_id;
proxy_connect_timeout 10s;
proxy_send_timeout    60s;
proxy_read_timeout    60s;
