# CORS + security headers for non-OPTIONS responses in CORS-enabled locations.
# Security headers are repeated here because any location that calls
# add_header does NOT inherit the server-level add_header directives.
add_header Access-Control-Allow-Origin      "$cors_origin"               always;
add_header Access-Control-Allow-Credentials "true"                       always;
add_header Access-Control-Expose-Headers    "X-Auth-Token, X-Request-ID" always;
add_header Strict-Transport-Security        "max-age=31536000; includeSubDomains" always;
add_header X-Frame-Options                  "DENY"                                always;
add_header X-Content-Type-Options           "nosniff"                             always;
add_header Referrer-Policy                  "strict-origin-when-cross-origin"     always;
add_header Permissions-Policy               "interest-cohort=()"                  always;
