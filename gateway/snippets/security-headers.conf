# Security response headers — included in every HTTPS location that emits
# a response.  MUST be re-included explicitly in any location block that
# defines its own add_header directives (nginx drops parent-level add_header
# the moment a location has even one of its own).
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Frame-Options           "DENY"                                 always;
add_header X-Content-Type-Options    "nosniff"                              always;
add_header Referrer-Policy           "strict-origin-when-cross-origin"      always;
add_header Permissions-Policy        "interest-cohort=()"                   always;
