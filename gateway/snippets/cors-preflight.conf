# CORS preflight response — included at the top of every CORS-enabled location.
# All headers are set explicitly inside the if-block because nginx `return`
# bypasses any add_header directives outside the block.
if ($request_method = OPTIONS) {
    add_header Access-Control-Allow-Origin      "$cors_origin"                                                                       always;
    add_header Access-Control-Allow-Credentials "true"                                                                               always;
    add_header Access-Control-Allow-Methods     "GET, POST, PUT, DELETE, OPTIONS, PATCH"                                             always;
    add_header Access-Control-Allow-Headers     "Authorization, Content-Type, X-User-Token, Accept, Cache-Control, X-Requested-With, Last-Event-ID, X-Double-Check" always;
    add_header Access-Control-Expose-Headers    "X-Auth-Token, X-Request-ID"                                                        always;
    add_header Access-Control-Max-Age           3600                                                                                 always;
    # Security headers must also be set here — they are not inherited from
    # the location or server level when inside an if-block.
    add_header Strict-Transport-Security        "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options                  "DENY"                                always;
    add_header X-Content-Type-Options           "nosniff"                             always;
    add_header Referrer-Policy                  "strict-origin-when-cross-origin"     always;
    add_header Content-Length 0;
    return 204;
}
