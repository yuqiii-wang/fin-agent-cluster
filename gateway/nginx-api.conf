# nginx-api.conf — API gateway replacing Kong.
#
# Listeners:
#   :8000   plain HTTP   – internal only (nginx-ui /_backend_health, Prometheus exporter)
#   :8443   HTTPS/HTTP2  – browser REST traffic
#
# Upstreams:
#   runner_rr     least-conn round-robin  — stateless endpoints
#   runner_sticky consistent-hashing on thread UUID — thread-scoped endpoints
#
# Sticky routing:
#   POST  /api/v1/threads/query   → runner_rr  (creates a new thread, no affinity yet)
#   *     /api/v1/threads/*       → runner_sticky (all per-thread operations)
#   *     everything else         → runner_rr
#
# Thread-ID extraction (superior to Kong's hash_on:path):
#   $thread_sticky_key extracts the UUID from /api/v1/threads/{uuid}/...
#   so that /ack, /nodes, /tasks for the same thread all hash to the same
#   backend, regardless of the sub-path.
#
# CORS:
#   OPTIONS preflight is handled inside each location with `return 204`.
#   Because nginx `add_header` inside an `if { return }` block does NOT
#   inherit parent-level add_header directives, all required CORS headers
#   are set explicitly within each OPTIONS block.
#   Non-OPTIONS responses carry the three persistent CORS headers defined
#   at the location level (Origin, Credentials, Expose-Headers).

# ── Rate-limiting zones ──────────────────────────────────────────────────────
limit_req_zone $binary_remote_addr zone=api_general:10m rate=5r/s;    # 300 req/min per IP
limit_req_zone $binary_remote_addr zone=api_heavy:10m   rate=100r/s;  # 6000 req/min per IP

# ── CORS origin allowlist ────────────────────────────────────────────────────
# Permit any localhost or 127.0.0.1 origin (Vite dev on :3000, nginx-ui on :22332).
map $http_origin $cors_origin {
    ~^https?://(localhost|127\.0\.0\.1)(:[0-9]+)?$  $http_origin;
    default                                          "";
}

# ── Thread-ID extraction for consistent hashing ─────────────────────────────
# Match a standard UUID in the third path segment after /api/v1/threads/.
# Non-UUID segments (e.g. "query") do not match, so $thread_sticky_key
# falls back to $uri — those paths are caught by the exact-match rule for
# /api/v1/threads/query before reaching the sticky location.
map $uri $thread_sticky_key {
    "~^/api/v1/threads/([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})"  $1;
    default  $uri;
}

# ── Round-robin upstream (stateless) ────────────────────────────────────────
upstream runner_rr {
    least_conn;
    server host.docker.internal:8432 max_fails=3 fail_timeout=10s;
    server host.docker.internal:8433 max_fails=3 fail_timeout=10s;
    server host.docker.internal:8434 max_fails=3 fail_timeout=10s;
    server host.docker.internal:8435 max_fails=3 fail_timeout=10s;
    keepalive 256;
    keepalive_requests 1000;
    keepalive_timeout  65s;
}

# ── Consistent-hash upstream (thread-affine) ────────────────────────────────
upstream runner_sticky {
    hash $thread_sticky_key consistent;
    server host.docker.internal:8432 max_fails=3 fail_timeout=10s;
    server host.docker.internal:8433 max_fails=3 fail_timeout=10s;
    server host.docker.internal:8434 max_fails=3 fail_timeout=10s;
    server host.docker.internal:8435 max_fails=3 fail_timeout=10s;
    keepalive 256;
    keepalive_requests 1000;
    keepalive_timeout  65s;
}

# ── HTTP server (port 8000) — internal traffic only ─────────────────────────
# Used by: nginx-ui /_backend_health subrequest, Prometheus nginx-exporter.
# No TLS, no CORS (not exposed to browsers).
server {
    listen      8000 default_server;
    listen [::]:8000 default_server;
    server_name _;

    client_max_body_size 10m;

    proxy_http_version    1.1;
    proxy_set_header      Connection      "";
    proxy_set_header      Host            $host;
    proxy_set_header      X-Real-IP       $remote_addr;
    proxy_set_header      X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header      X-Request-ID    $request_id;
    proxy_connect_timeout 10s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;

    # nginx stub_status — scraped by nginx-prometheus-exporter sidecar
    location = /_nginx_status {
        stub_status;
        allow 172.16.0.0/12;  # Docker bridge networks
        allow 127.0.0.0/8;
        deny  all;
        access_log off;
    }

    # Lightweight self-health probe — returns 200 immediately without touching
    # the backend.  Used by the Docker healthcheck so nginx-api is marked
    # healthy as soon as nginx is up, independent of FastAPI runner state.
    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Health, docs — no rate limit, round-robin
    location ~ ^/(health|docs|redoc|openapi\.json)$ {
        proxy_pass http://runner_rr;
    }

    # New query — high rate limit, round-robin
    location = /api/v1/threads/query {
        limit_req zone=api_heavy burst=200 nodelay;
        proxy_pass http://runner_rr;
    }

    # Thread-scoped operations — consistent-hash on thread UUID
    location ^~ /api/v1/threads {
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_pass http://runner_sticky;
    }

    # General API catch-all — rate limit, round-robin
    location / {
        limit_req zone=api_general burst=50 nodelay;
        proxy_pass http://runner_rr;
    }
}

# ── HTTPS server (port 8443) — browser traffic ───────────────────────────────
server {
    listen      8443 ssl;
    listen [::]:8443 ssl;
    http2       on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/localhost.crt;
    ssl_certificate_key /etc/nginx/certs/localhost.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size 10m;

    proxy_http_version    1.1;
    proxy_set_header      Connection      "";
    proxy_set_header      Host            $host;
    proxy_set_header      X-Real-IP       $remote_addr;
    proxy_set_header      X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header      X-Request-ID    $request_id;
    proxy_connect_timeout 10s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;

    # nginx stub_status — also accessible on HTTPS for tooling convenience
    location = /_nginx_status {
        stub_status;
        allow 172.16.0.0/12;
        allow 127.0.0.0/8;
        deny  all;
        access_log off;
    }

    # Health, docs — no rate limit, round-robin
    # No CORS needed: these are not cross-origin browser calls in normal usage.
    location ~ ^/(health|docs|redoc|openapi\.json)$ {
        proxy_pass http://runner_rr;
    }

    # ── New query submission (no thread_id yet) ──────────────────────────────
    # Exact match wins over the ^~ /api/v1/threads prefix below.
    # Round-robin + high rate limit.
    location = /api/v1/threads/query {
        # CORS preflight — all required headers must live inside this if-block
        # because nginx `return` bypasses parent add_header directives.
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin      "$cors_origin"  always;
            add_header Access-Control-Allow-Credentials "true"          always;
            add_header Access-Control-Allow-Methods     "GET, POST, PUT, DELETE, OPTIONS, PATCH" always;
            add_header Access-Control-Allow-Headers     "Authorization, Content-Type, X-User-Token, Accept, Cache-Control, X-Requested-With, Last-Event-ID, X-Double-Check" always;
            add_header Access-Control-Expose-Headers    "X-Auth-Token, X-Request-ID" always;
            add_header Access-Control-Max-Age           3600 always;
            add_header Content-Length 0;
            return 204;
        }
        add_header Access-Control-Allow-Origin      "$cors_origin" always;
        add_header Access-Control-Allow-Credentials "true"         always;
        add_header Access-Control-Expose-Headers    "X-Auth-Token, X-Request-ID" always;
        limit_req zone=api_heavy burst=200 nodelay;
        proxy_pass http://runner_rr;
    }

    # ── Thread-scoped operations (consistent-hash on thread UUID) ────────────
    # Matches /api/v1/threads (list) and /api/v1/threads/{uuid}/... (all ops).
    # $thread_sticky_key extracts the UUID so all sub-paths of a thread
    # route to the same backend worker.
    location ^~ /api/v1/threads {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin      "$cors_origin"  always;
            add_header Access-Control-Allow-Credentials "true"          always;
            add_header Access-Control-Allow-Methods     "GET, POST, PUT, DELETE, OPTIONS, PATCH" always;
            add_header Access-Control-Allow-Headers     "Authorization, Content-Type, X-User-Token, Accept, Cache-Control, X-Requested-With, Last-Event-ID, X-Double-Check" always;
            add_header Access-Control-Expose-Headers    "X-Auth-Token, X-Request-ID" always;
            add_header Access-Control-Max-Age           3600 always;
            add_header Content-Length 0;
            return 204;
        }
        add_header Access-Control-Allow-Origin      "$cors_origin" always;
        add_header Access-Control-Allow-Credentials "true"         always;
        add_header Access-Control-Expose-Headers    "X-Auth-Token, X-Request-ID" always;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_pass http://runner_sticky;
    }

    # ── All other API / RPC routes (round-robin) ─────────────────────────────
    # Covers: /api/v1/auth/*, /api/v1/queries/*, /api/v1/system/*,
    #         /api/v1/centrifugo/rpc, /api/v1/reports/*, /api/v1/quant/*
    location / {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin      "$cors_origin"  always;
            add_header Access-Control-Allow-Credentials "true"          always;
            add_header Access-Control-Allow-Methods     "GET, POST, PUT, DELETE, OPTIONS, PATCH" always;
            add_header Access-Control-Allow-Headers     "Authorization, Content-Type, X-User-Token, Accept, Cache-Control, X-Requested-With, Last-Event-ID, X-Double-Check" always;
            add_header Access-Control-Expose-Headers    "X-Auth-Token, X-Request-ID" always;
            add_header Access-Control-Max-Age           3600 always;
            add_header Content-Length 0;
            return 204;
        }
        add_header Access-Control-Allow-Origin      "$cors_origin" always;
        add_header Access-Control-Allow-Credentials "true"         always;
        add_header Access-Control-Expose-Headers    "X-Auth-Token, X-Request-ID" always;
        limit_req zone=api_general burst=50 nodelay;
        proxy_pass http://runner_rr;
    }
}
