# nginx-internal.conf — API gateway.
#
# Listeners:
#   :8000   plain HTTP   – internal only (nginx-ui /_backend_health, Prometheus exporter)
#   :8443   HTTPS/HTTP2  – browser REST traffic
#
# Upstreams:
#   runner_rr     least-conn round-robin  — stateless endpoints
#   runner_sticky consistent-hashing on thread UUID — thread-scoped endpoints
#
# Sticky routing:
#   POST  /api/v1/threads/query   → runner_rr  (creates a new thread, no affinity yet)
#   *     /api/v1/threads/*       → runner_sticky (all per-thread operations)
#   *     everything else         → runner_rr
#
# Thread-ID extraction:
#   $thread_sticky_key extracts the UUID from /api/v1/threads/{uuid}/...
#   so /ack, /nodes, /tasks for the same thread all hash to the same backend.
#
# CORS (HTTPS server only):
#   OPTIONS preflight → snippets/cors-preflight.conf (self-contained if-block)
#   Other methods     → snippets/cors-response.conf  (CORS + security headers)
#   Security headers are repeated inside both snippets because nginx silently
#   drops all parent-level add_header directives the moment a location block
#   defines even one of its own.

# Hide nginx version from error pages and Server response header.
server_tokens off;

# ── Rate-limiting zones ──────────────────────────────────────────────────────
limit_req_zone $binary_remote_addr zone=api_general:10m rate=5r/s;    # 300 req/min per IP
limit_req_zone $binary_remote_addr zone=api_heavy:10m   rate=100r/s;  # 6000 req/min per IP

# ── CORS origin allowlist ────────────────────────────────────────────────────
# Permit any localhost or 127.0.0.1 origin (Vite dev on :3000, nginx-ui on :22332).
map $http_origin $cors_origin {
    ~^https?://(localhost|127\.0\.0\.1)(:[0-9]+)?$  $http_origin;
    default                                          "";
}

# ── Thread-ID extraction for consistent hashing ─────────────────────────────
# Match a standard UUID in the third path segment after /api/v1/threads/.
# Non-UUID segments (e.g. "query") do not match → $thread_sticky_key falls
# back to $uri and is caught by the exact-match rule for /api/v1/threads/query.
map $uri $thread_sticky_key {
    "~^/api/v1/threads/([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})"  $1;
    default  $uri;
}

# ── Round-robin upstream (stateless) ────────────────────────────────────────
upstream runner_rr {
    least_conn;
    server host.docker.internal:8432 max_fails=3 fail_timeout=10s;
    server host.docker.internal:8433 max_fails=3 fail_timeout=10s;
    server host.docker.internal:8434 max_fails=3 fail_timeout=10s;
    server host.docker.internal:8435 max_fails=3 fail_timeout=10s;
    keepalive 256;
    keepalive_requests 1000;
    keepalive_timeout  65s;
}

# ── Consistent-hash upstream (thread-affine) ────────────────────────────────
upstream runner_sticky {
    hash $thread_sticky_key consistent;
    server host.docker.internal:8432 max_fails=3 fail_timeout=10s;
    server host.docker.internal:8433 max_fails=3 fail_timeout=10s;
    server host.docker.internal:8434 max_fails=3 fail_timeout=10s;
    server host.docker.internal:8435 max_fails=3 fail_timeout=10s;
    keepalive 256;
    keepalive_requests 1000;
    keepalive_timeout  65s;
}

upstream sandbox_runner_0 {
    server sandbox-runner-0:8000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

upstream sandbox_runner_1 {
    server sandbox-runner-1:8000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# ── HTTP server (port 8000) — internal traffic only ─────────────────────────
# Used by: nginx-ui /_backend_health subrequest, Prometheus nginx-exporter.
# Restricted to Docker bridge and loopback — never reachable from external
# networks because docker-compose binds the host port to 127.0.0.1 only.
server {
    listen      8000 default_server;
    listen [::]:8000 default_server;
    server_name _;

    # Defense-in-depth: block any traffic that is not from Docker bridge
    # networks or loopback, even if the container network is misconfigured.
    allow 172.16.0.0/12;  # Docker bridge (172.17–172.31)
    allow 10.0.0.0/8;     # Docker custom networks (10.x)
    allow 127.0.0.0/8;    # loopback
    deny  all;

    client_max_body_size 10m;
    include /etc/nginx/snippets/proxy-headers.conf;

    # nginx stub_status — scraped by nginx-prometheus-exporter sidecar.
    location = /_nginx_status {
        stub_status;
        allow 172.16.0.0/12;  # Docker bridge networks
        allow 127.0.0.0/8;
        deny  all;
        access_log off;
    }

    # Lightweight self-health probe — returns 200 without touching the backend.
    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    location ^~ /_sandbox/0/ {
        rewrite ^/_sandbox/0/(.*)$ /$1 break;
        proxy_pass http://sandbox_runner_0;
    }

    location ^~ /_sandbox/1/ {
        rewrite ^/_sandbox/1/(.*)$ /$1 break;
        proxy_pass http://sandbox_runner_1;
    }

    # Health, docs — no rate limit, round-robin.
    location ~ ^/(health|docs|redoc|openapi\.json)$ {
        proxy_pass http://runner_rr;
    }

    # New query — high rate limit, round-robin.
    location = /api/v1/threads/query {
        limit_req zone=api_heavy burst=200 nodelay;
        proxy_pass http://runner_rr;
    }

    # Thread-scoped operations — consistent-hash on thread UUID.
    location ^~ /api/v1/threads {
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_pass http://runner_sticky;
    }

    # Centrifugo internal proxy calls — no rate limit (Docker-internal only).
    location ^~ /api/v1/centrifugo/ {
        proxy_pass http://runner_rr;
    }

    # General API catch-all — rate limit, round-robin.
    location / {
        limit_req zone=api_general burst=50 nodelay;
        proxy_pass http://runner_rr;
    }
}

# ── HTTPS server (port 8443) — browser traffic ───────────────────────────────
server {
    listen      8443 ssl;
    listen [::]:8443 ssl;
    http2       on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/localhost.crt;
    ssl_certificate_key /etc/nginx/certs/localhost.key;
    include /etc/nginx/snippets/ssl-params.conf;

    client_max_body_size 10m;
    include /etc/nginx/snippets/proxy-headers.conf;

    # nginx stub_status is served on :8000 only (scraped by prometheus-exporter
    # via Docker-internal network).  Not exposed here on the public HTTPS port.

    # Health, docs — no rate limit, round-robin.
    # Include security headers explicitly: location add_header does not inherit
    # from the server level once the location has its own add_header.
    location ~ ^/(health|docs|redoc|openapi\.json)$ {
        include /etc/nginx/snippets/security-headers.conf;
        proxy_pass http://runner_rr;
    }

    # ── New query submission (no thread_id yet) ──────────────────────────────
    # Exact match wins over the ^~ /api/v1/threads prefix below.
    location = /api/v1/threads/query {
        include /etc/nginx/snippets/cors-preflight.conf;
        include /etc/nginx/snippets/cors-response.conf;
        limit_req zone=api_heavy burst=200 nodelay;
        proxy_pass http://runner_rr;
    }

    # ── Thread-scoped operations (consistent-hash on thread UUID) ────────────
    # Matches /api/v1/threads (list) and /api/v1/threads/{uuid}/... (all ops).
    # $thread_sticky_key extracts the UUID so all sub-paths of a thread
    # route to the same backend worker.
    location ^~ /api/v1/threads {
        include /etc/nginx/snippets/cors-preflight.conf;
        include /etc/nginx/snippets/cors-response.conf;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_pass http://runner_sticky;
    }

    # ── All other API / RPC routes (round-robin) ─────────────────────────────
    # Covers: /api/v1/auth/*, /api/v1/queries/*, /api/v1/system/*,
    #         /api/v1/centrifugo/rpc, /api/v1/reports/*, /api/v1/quant/*
    location / {
        include /etc/nginx/snippets/cors-preflight.conf;
        include /etc/nginx/snippets/cors-response.conf;
        limit_req zone=api_general burst=50 nodelay;
        proxy_pass http://runner_rr;
    }
}
