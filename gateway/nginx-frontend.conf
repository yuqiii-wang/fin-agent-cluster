# Redirect HTTP → HTTPS
server {
    listen 80;
    server_tokens off;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    ssl_certificate     /etc/nginx/certs/localhost.crt;
    ssl_certificate_key /etc/nginx/certs/localhost.key;
    include /etc/nginx/snippets/ssl-params.conf;

    # Security headers at server level — inherited by locations that do NOT
    # define their own add_header.  Re-included explicitly in locations that do.
    include /etc/nginx/snippets/security-headers.conf;

    # Serve static assets with long-lived cache headers.
    # Must re-include security-headers here: any location with add_header
    # loses all parent-level add_header inheritance (nginx rule).
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── Backend health gate ──────────────────────────────────────────────────
    # Internal subrequest used by auth_request.  Proxies to nginx-internal HTTP port
    # so no TLS overhead is added for this container-internal call.
    # Returns 200 when at least one FastAPI runner is healthy; nginx-internal returns
    # 502/503 when all runner targets fail, causing auth_request to return HTTP
    # 500 to the parent request (see error_page below).
    location = /_backend_health {
        internal;
        proxy_pass              http://nginx-internal:8000/health;
        proxy_pass_request_body off;
        proxy_set_header        Content-Length   "";
        proxy_set_header        X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_connect_timeout   3s;
        proxy_read_timeout      5s;
    }

    # Named location that serves the static restarting page.
    # try_files guarantees a 503 (not a redirect loop) if the file is absent.
    location @restarting {
        root      /usr/share/nginx/html;
        try_files /restarting.html =503;
    }

    # Root page gate: check that at least one FastAPI runner is alive before
    # serving the React SPA.  auth_request issues a subrequest to
    # /_backend_health; a non-2xx response causes nginx to return 500 which is
    # caught by error_page and forwarded to @restarting.
    location = / {
        auth_request /_backend_health;
        error_page   500 = @restarting;
        try_files    /index.html =404;
    }

    # Lightweight nginx-internal health probe for Docker health check.
    # Returns 200 immediately without checking the backend; used by the
    # `healthcheck` directive in docker-compose.yml so the nginx container
    # is not marked unhealthy during normal FastAPI restarts.
    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # ── Centrifugo WebSocket proxy ───────────────────────────────────────────
    # nginx listens on port 443 (TLS, HTTP/1.1 — no http2 directive).
    # Browsers negotiate HTTP/1.1 here, so the standard WebSocket Upgrade
    # mechanism works reliably.  nginx terminates TLS and forwards plain
    # WebSocket to the centrifugo containers on port 8000.
    location /centrifugo-sse-0/ {
        proxy_pass              http://centrifugo-sse-0:8000/;
        proxy_http_version      1.1;
        proxy_set_header        Upgrade    $http_upgrade;
        proxy_set_header        Connection "upgrade";
        proxy_set_header        Host       centrifugo-sse-0;
        proxy_set_header        Origin     $http_origin;
        proxy_read_timeout      86400s;
        proxy_send_timeout      86400s;
    }

    location /centrifugo-sse-1/ {
        proxy_pass              http://centrifugo-sse-1:8000/;
        proxy_http_version      1.1;
        proxy_set_header        Upgrade    $http_upgrade;
        proxy_set_header        Connection "upgrade";
        proxy_set_header        Host       centrifugo-sse-1;
        proxy_set_header        Origin     $http_origin;
        proxy_read_timeout      86400s;
        proxy_send_timeout      86400s;
    }

    location /centrifugo-llm-0/ {
        proxy_pass              http://centrifugo-llm-0:8000/;
        proxy_http_version      1.1;
        proxy_set_header        Upgrade    $http_upgrade;
        proxy_set_header        Connection "upgrade";
        proxy_set_header        Host       centrifugo-llm-0;
        proxy_set_header        Origin     $http_origin;
        proxy_read_timeout      86400s;
        proxy_send_timeout      86400s;
    }

    location /centrifugo-llm-1/ {
        proxy_pass              http://centrifugo-llm-1:8000/;
        proxy_http_version      1.1;
        proxy_set_header        Upgrade    $http_upgrade;
        proxy_set_header        Connection "upgrade";
        proxy_set_header        Host       centrifugo-llm-1;
        proxy_set_header        Origin     $http_origin;
        proxy_read_timeout      86400s;
        proxy_send_timeout      86400s;
    }

    # SPA fallback — every unmatched path returns index.html so React Router
    # can handle client-side routing.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

