<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="refresh" content="5" />
  <title>Backend Restarting…</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: #0d1117;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #c9d1d9;
    }

    .card {
      text-align: center;
      padding: 48px 56px;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      max-width: 480px;
      width: 90%;
    }

    .spinner {
      width: 48px;
      height: 48px;
      margin: 0 auto 28px;
      border: 4px solid #30363d;
      border-top-color: #1890ff;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    h1 {
      font-size: 1.4rem;
      font-weight: 600;
      color: #e6edf3;
      margin-bottom: 12px;
    }

    p {
      font-size: 0.95rem;
      color: #8b949e;
      line-height: 1.6;
      margin-bottom: 20px;
    }

    .badge {
      display: inline-block;
      padding: 4px 12px;
      background: #1c2128;
      border: 1px solid #30363d;
      border-radius: 20px;
      font-size: 0.8rem;
      color: #8b949e;
    }

    .dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      background: #f0883e;
      border-radius: 50%;
      margin-right: 6px;
      animation: pulse 1.4s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.3; }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="spinner"></div>
    <h1>Backend is starting up</h1>
    <p>
      The trading cluster backend is initialising.<br />
      This page refreshes automatically every 5 seconds.
    </p>
    <div class="badge">
      <span class="dot"></span>In progress — please wait
    </div>
  </div>
</body>
</html>
