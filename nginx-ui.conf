# Redirect HTTP → HTTPS
server {
    listen 80;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    root /usr/share/nginx/html;
    index index.html;

    ssl_certificate     /etc/nginx/certs/localhost.crt;
    ssl_certificate_key /etc/nginx/certs/localhost.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Centrifugo WebSocket proxy — avoids HTTP/2 hop-by-hop header stripping.
    # Browser connects wss://localhost:22332/centrifugo-{n}/... (HTTP/1.1 WS upgrade);
    # nginx forwards to Kong's plain HTTP/1.1 port so the WS handshake succeeds.
    location /centrifugo-0/ {
        proxy_pass         http://kong:8000/centrifugo-0/;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_read_timeout 3600s;
    }

    location /centrifugo-1/ {
        proxy_pass         http://kong:8000/centrifugo-1/;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_read_timeout 3600s;
    }

    # Serve static assets with long-lived cache headers.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── Backend health gate ──────────────────────────────────────────────────
    # Internal subrequest used by auth_request.  Proxies to Kong's HTTP port so
    # no TLS overhead is added for this container-internal call.
    # Returns 200 when at least one FastAPI runner is healthy; Kong returns 503
    # when all runner targets fail active health checks, causing auth_request to
    # return HTTP 500 to the parent request (see error_page below).
    location = /_backend_health {
        internal;
        proxy_pass              http://kong:8000/api/v1/health;
        proxy_pass_request_body off;
        proxy_set_header        Content-Length   "";
        proxy_set_header        X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_connect_timeout   3s;
        proxy_read_timeout      5s;
    }

    # Named location that serves the static restarting page.
    # try_files guarantees a 503 (not a redirect loop) if the file is absent.
    location @restarting {
        root      /usr/share/nginx/html;
        try_files /restarting.html =503;
    }

    # Root page gate: check that at least one FastAPI runner is alive before
    # serving the React SPA.  auth_request issues a subrequest to
    # /_backend_health; a non-2xx response causes nginx to return 500 which is
    # caught by error_page and forwarded to @restarting.
    location = / {
        auth_request /_backend_health;
        error_page   500 = @restarting;
        try_files    /index.html =404;
    }

    # Lightweight nginx-internal health probe for Docker health check.
    # Returns 200 immediately without checking the backend; used by the
    # `healthcheck` directive in docker-compose.yml so the nginx container
    # is not marked unhealthy during normal FastAPI restarts.
    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # SPA fallback — every unmatched path returns index.html so React Router
    # can handle client-side routing.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

