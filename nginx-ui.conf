# Redirect HTTP → HTTPS
server {
    listen 80;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    root /usr/share/nginx/html;
    index index.html;

    ssl_certificate     /etc/nginx/certs/localhost.crt;
    ssl_certificate_key /etc/nginx/certs/localhost.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Centrifugo WebSocket proxy — avoids HTTP/2 hop-by-hop header stripping.
    # Browser connects wss://localhost:22332/centrifugo-{n}/... (HTTP/1.1 WS upgrade);
    # nginx forwards to Kong's plain HTTP/1.1 port so the WS handshake succeeds.
    location /centrifugo-0/ {
        proxy_pass         http://kong:8000/centrifugo-0/;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_read_timeout 3600s;
    }

    location /centrifugo-1/ {
        proxy_pass         http://kong:8000/centrifugo-1/;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_read_timeout 3600s;
    }

    # Serve static assets with long-lived cache headers.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback — every unmatched path returns index.html so React Router
    # can handle client-side routing.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
